name: Bug Report
description: Report a reproducible bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below.
  - type: input
    id: version
    attributes:
      label: OmniGate Version
      description: Output of `git log --oneline -1` or Docker tag
      placeholder: "e.g., 1.0.0 or commit hash"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Bun version and OS
      placeholder: "e.g., Bun 1.1.0 on Ubuntu 22.04"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Minimal steps to reproduce the bug
      placeholder: |
        1. Start OmniGate with `bun run dev`
        2. Send request to `/v1/chat/completions` with model `omnigate/auto-fast`
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens? Include error messages, logs, stack traces.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Provider Configuration
      description: Relevant parts of provider.registry.yaml (sanitize API keys)
      render: yaml
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues
          required: true
        - label: I have tested with a minimal config
          required: true
        - label: I have sanitized any API keys in logs/config
          required: true
