name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe the problem and your proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What pain point does this address? Who is affected?
      placeholder: "Currently, there's no way to track cost per provider..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? Include API changes, config additions, etc.
      placeholder: "Add `cost_per_token` to provider registry, aggregate in daily_stats..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider? Why is this the best?
  - type: textarea
    id: implementation
    attributes:
      label: Implementation Notes
      description: Any technical details, files that would need changes, breaking changes?
      render: markdown
  - type: checkboxes
    id: willingness
    attributes:
      label: Willingness
      options:
        - label: I am willing to implement this feature
        - label: I can help test this feature
        - label: This is a request only
