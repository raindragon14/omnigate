# Provider registry — live deployment (phiconsulting.biz.id).
#
# Each provider's `api_key_env` must have a matching value in `.env`.
#
# Fields:
#   id            unique identifier used internally for routing stats
#   base_url      OpenAI-compatible chat-completions endpoint
#   model         the model name the upstream service expects
#   api_key_env   environment variable holding the upstream API key
#   family        routing group; aliases map to one or more families
#   priority      tiebreaker when scores are equal (higher wins)
#   quality_score 0-100, used by the quality routing mode
#   speed_score   0-100, used by the speed routing mode
#   enabled       set to false to exclude without removing the entry
#   rate_limit    optional {rpm, rph, rpd} for quota-pressure scoring
#   supports_*    optional feature flags used for request matching
#                 (supports_reasoning gates reasoning_effort requests)
#   max_tokens_field  optional max_tokens | max_completion_tokens body key

providers:
  - id: commandcode_flash
    base_url: "https://api.commandcode.ai/provider/v1"
    model: "xiaomi/mimo-v2.6-flash"
    api_key_env: "COMMANDCODE_API_KEY"
    family: "chat-fast"
    priority: 95
    quality_score: 85
    speed_score: 92
    enabled: true
    supports_tools: true
    supports_json: true
    supports_streaming: true
    supports_reasoning: true

  - id: commandcode_pro
    base_url: "https://api.commandcode.ai/provider/v1"
    model: "xiaomi/mimo-v2.6-pro"
    api_key_env: "COMMANDCODE_API_KEY"
    family: "chat-quality"
    priority: 92
    quality_score: 93
    speed_score: 70
    enabled: true
    supports_tools: true
    supports_json: true
    supports_streaming: true
    supports_reasoning: true

  # Public free-tier upstream (anonymous tier, no real key required).
  # Used as the backup/fallback path — genuinely flaky by design, which is
  # exactly what the fallback loop is for.
  - id: pollinations_public
    base_url: "https://text.pollinations.ai/openai"
    model: "openai"
    api_key_env: "POLLINATIONS_API_KEY"
    family: "chat-balanced"
    priority: 75
    quality_score: 75
    speed_score: 60
    enabled: true
    supports_tools: false
    supports_json: true
    supports_streaming: true

aliases:
  omnigate/auto-fast:
    families: ["chat-fast", "chat-balanced"]
  omnigate/auto-quality:
    families: ["chat-quality", "chat-balanced"]
  omnigate/coding-auto:
    families: ["chat-quality", "chat-fast"]
  omnigate/coding-fast:
    families: ["chat-fast"]
    weights:
      speed: 5
      quality: 0.5
    tiebreak: speed
